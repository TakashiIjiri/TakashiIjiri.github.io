<h1>Image Filtering Demo</h1><p class="lead">線形フィルタ・メディアンフィルタ・バイラテラルフィルタの比較。画像処理はブラウザ内で実行。</p>

<div class="toolbar"><label>フィルタ　<select id="method"><option value="linear">(1) 線形フィルタ</option><option value="median">(2) Median フィルタ</option><option value="bilateral">(3) Bilateral フィルタ</option></select></label><label>別の画像　<input type="file" id="file" accept="image/*"></label><button id="defaultImage">猫の画像に戻す</button></div>

<section class="settings" id="linearSettings"><div class="settings-title">線形フィルタ：カーネル係数</div><div class="row"><label>サイズ <select id="kernelSize"><option value="1">1 × 1</option><option value="3" selected>3 × 3</option><option value="5">5 × 5</option></select></label><label>プリセット <select id="preset"><option value="box">平均化</option><option value="gauss">ガウス近似</option><option value="sharpen">鮮鋭化</option><option value="edge">エッジ検出</option><option value="custom">カスタム</option></select></label><label><input id="normalize" type="checkbox" checked> 係数を自動正規化（総和で割る）</label></div><div class="kernel" id="kernel"></div><div class="kernel-footer">中心合わせのカーネルです。係数は直接編集できます。境界は端の画素を複製します。係数の総和が0の場合、正規化せずそのまま適用します。<span id="kernelSum"></span></div></section>

<section class="settings hidden" id="medianSettings"><div class="settings-title">Median フィルタ</div><div class="row"><label>窓サイズ <select id="medianSize"><option value="3" selected>3 × 3</option><option value="5">5 × 5</option><option value="7">7 × 7</option><option value="9">9 × 9</option></select></label></div><p class="muted">各色チャンネルの近傍値の中央値を採用します。</p></section>

<section class="settings hidden" id="bilateralSettings"><div class="settings-title">Bilateral フィルタ</div><div class="row"><label>空間 σ<sub>s</sub> <input id="sigmaSpace" type="range" min="0.5" max="6" step="0.5" value="3"><span id="spaceVal" class="value">3.0</span> px</label><label>輝度 σ<sub>r</sub> <input id="sigmaRange" type="range" min="5" max="120" step="5" value="30"><span id="rangeVal" class="value">30</span></label></div><p class="muted">近い画素ほど重く、色の差が小さい画素ほど重くして平均します。空間窓の半径は約 2σ<sub>s</sub> に設定しています。σ<sub>r</sub> は画素値0〜255のスケールです。</p></section>

<div class="images"><section class="image-card"><h2>オリジナル</h2><div class="image-wrap"><canvas id="original"></canvas></div></section><section class="image-card"><h2>フィルタ後</h2><div class="image-wrap"><canvas id="filtered"></canvas></div></section></div>

function kernelSize(){return Number($('kernelSize').value)}
function activeCell(index){let n=kernelSize(),margin=(5-n)/2,y=Math.floor(index/5),x=index%5;return x>=margin&&x<5-margin&&y>=margin&&y<5-margin}

    function bilateral(src, dst, w, h) {

            sr = Number($('sigmaRange').value),
            rad = Math.ceil(ss * 2),
